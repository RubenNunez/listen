[package]
name = "listen-router-app"
description = "The Listen Router as a desktop app with a tray icon"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "listen-router-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
listen-router = { path = "../router" }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-autostart = "2.7"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
