[workspace]
resolver = "2"
members = ["crates/router-proto", "crates/router", "crates/routerctl", "crates/router-app"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tokio = { version = "1", features = ["full"] }
