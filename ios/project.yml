name: Listen
options:
  bundleIdPrefix: com.meowop.listen
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: "1.0.0"
  GRPC:
    url: https://github.com/grpc/grpc-swift-2.git
    exactVersion: "2.4.4"
  GRPCNIO:
    url: https://github.com/grpc/grpc-swift-nio-transport.git
    exactVersion: "2.12.0"
  GRPCProtobuf:
    url: https://github.com/grpc/grpc-swift-protobuf.git
    exactVersion: "2.5.0"
  MLXAudio:
    url: https://github.com/Blaizzy/mlx-audio-swift
    exactVersion: "0.2.1"
  # Pocket TTS through Core ML. v0.18.4 is commit e0c6103bc87a88d25276cad491c86e757f58c865.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: "0.18.4"
targets:
  Listen:
    type: application
    platform: iOS
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: ArgmaxOSS
        product: SpeakerKit
      - package: GRPC
        product: GRPCCore
      - package: GRPCNIO
        product: GRPCNIOTransportHTTP2
      - package: GRPCProtobuf
        product: GRPCProtobuf
      - package: MLXAudio
        product: MLXAudioTTS
      - package: MLXAudio
        product: MLXAudioCore
      - package: FluidAudio
        product: FluidAudio
    sources:
      - Listen
      - path: ../LICENSE
        type: file
        buildPhase: resources
      - path: ../NOTICE
        type: file
        buildPhase: resources
      - path: ../THIRD_PARTY.md
        type: file
        buildPhase: resources
      - path: AppIcon.icon
        type: file
        buildPhase: resources
      - path: DocumentIcon/ListenDocument.icns
        type: file
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Listen
        CFBundleName: Listen
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ListenCommandLineVersion: 1
        CFBundleURLTypes:
          - CFBundleURLName: com.meowop.listen.router
            CFBundleURLSchemes: [listen]
        NSLocalNetworkUsageDescription: Listen connects to your own devices, Listen Router and tool servers on your network.
        NSCameraUsageDescription: Scan Listen QR codes to pair your router or transfer your setup. Images are not saved or uploaded.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CADisableMinimumFrameDurationOnPhone: true
        NSMicrophoneUsageDescription: Listen uses your microphone for on-device speech recognition when you enable listening.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # A recorded conversation as one file (ConversationFile): a ZIP archive, so any unzip
        # tool opens it. Listen opens it too: the conversation is replayed.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.meowop.listen.setup
            UTTypeDescription: Listen setup
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [listen-setup]
              public.mime-type: [application/vnd.meowop.listen.setup+json]
          - UTTypeIdentifier: com.meowop.listen.conversation
            UTTypeDescription: Listen conversation
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeIconFile: ListenDocument.icns
            UTTypeTagSpecification:
              public.filename-extension: [listen]
              public.mime-type: [application/vnd.meowop.listen+zip]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Listen setup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.meowop.listen.setup]
          - CFBundleTypeName: Listen conversation
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.meowop.listen.conversation]
            CFBundleTypeIconFile: ListenDocument.icns
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meowop.listen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: YES
  ListenTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ListenTests]
    dependencies:
      - target: Listen
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ListenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ListenUITests]
    dependencies:
      - target: Listen
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Listen:
    build:
      targets:
        Listen: all
        ListenTests: [test]
        ListenUITests: [test]
    test:
      targets: [ListenTests, ListenUITests]
      environmentVariables:
        LISTEN_TALKBACK_MUTE: "1"
        LISTEN_TEST_NO_MICROPHONE: "1"
